name: Keep scheduled sync alive

# GitHub disables scheduled workflows in public repositories after 60 days without
# repository activity, which would silently stop the iCal sync in deploy.yml.
# Re-enabling a workflow through the API resets that timer; this does it monthly for
# deploy.yml and for this workflow itself. No commits are made.

on:
  schedule:
    # 1st of every month (at most 31 days apart, well inside the 60-day limit).
    # Off the hour, when GitHub's scheduler is busiest.
    - cron: '17 4 1 * *'
  workflow_dispatch:

# Least privilege: enabling workflows needs actions:write and nothing else.
permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable the scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for workflow in deploy.yml keepalive.yml; do
            gh api --method PUT "repos/$REPO/actions/workflows/$workflow/enable"
            echo "Re-enabled $workflow"
          done
